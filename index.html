<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie counting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contanier">
    <select id="select1">
      <option value="">Select gender</option>
      <option value="male">male</option>
      <option value="Female">Female</option>
    </select>
    <input type="number" id="inp1" placeholder="Enter your age">
    <input type="number" id="inp2" placeholder="Enter your weight">
    <input type="number" id="inp3" placeholder="Enter your height">
    <select id="select2">
      <option value="">Choose your daily activity level</option>
      <option value="idle">idle</option>
      <option value="mild">Mild activity</option>
      <option value="mod">Moderate activity</option>
      <option value="high">high activity</option>
    </select>
    <select id="select3">
      <option value="">Choose a physical goal</option>
      <option value="loss">weight loss</option>
      <option value="mai">Maintaining weight</option>
      <option value="gain">Weight/Muscle Gain</option>
    </select>
    <button id="btn">Calculate your calories now ⚡</button>
    <h4 id="h4"></h4>
    <span id="span1"></span>
    <span id="span2"></span>
    <span id="span3"></span>
  </div>
  <script src="main.js"></script>
</body>
</html>
